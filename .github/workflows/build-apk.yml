# Compila el launcher en la nube (GitHub Actions, gratis). No necesitas SDK/JDK/gradle en tu PC.
name: Build MinimalTV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build debug APK
        working-directory: android-launcher
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp android-launcher/app/build/outputs/apk/debug/app-debug.apk minimaltv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minimaltv-apk
          path: minimaltv.apk
